name: Deploy to Firebase (Staging)

on:
  push:
    branches-ignore:
      - 'main'
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      # Install backend dependencies
      - name: Install Backend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: back

      # Install frontend dependencies
      - name: Install Frontend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: front

      # Build frontend
      - name: Build Frontend (Staging)
        run: yarn build
        working-directory: front
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          NODE_ENV: production

      # Deploy to Firebase using firebase-action
      - name: Debug Secrets
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$PID" ]; then
            echo "::error::FIREBASE_PROJECT_ID is EMPTY! Check your GitHub Secrets."
            exit 1
          else
            echo "FIREBASE_PROJECT_ID is set (masked)"
          fi

      - name: Deploy to Firebase (Staging)
        uses: w9jds/firebase-action@v13.16.0
        with:
          args: deploy --force --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

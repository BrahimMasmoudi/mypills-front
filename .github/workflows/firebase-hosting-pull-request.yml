name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      # Root dependencies (optional)
      - name: Install root dependencies
        run: if [ -f package.json ]; then yarn install --frozen-lockfile; fi

      # Frontend dependencies
      - name: Install frontend dependencies
        run: cd front && yarn install --frozen-lockfile

      # Firebase Functions dependencies
      - name: Install Firebase Functions dependencies
        run: cd back && yarn install --frozen-lockfile

      # Build frontend
      - name: Build frontend
        run: cd front && yarn generate
        env:
          NODE_ENV: production
          ENVIRONMENT: staging
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      # Build Firebase functions
      - name: Build Firebase functions
        run: cd back && yarn build

      # Deploy preview
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_CF64C }}
          projectId: my-pills-cf64c

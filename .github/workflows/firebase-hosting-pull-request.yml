name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      # 1. Install Firebase Functions dependencies
      - name: Install Firebase Functions dependencies
        run: cd back && yarn install --frozen-lockfile

      # 2. CREATE THE KEY
      - name: Create SA Key
        run: |
          # Use -p to ensure parent directories exist just in case
          mkdir -p back 
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}' > back/serviceAccountKey.json

      # 3. 🧪 RUN TESTS
      - name: Run Backend Tests
        run: |
          cd back
          yarn test
        env:
          TZ: UTC
          # Using a relative path is safer if you are already in the 'back' folder
          GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json

      # 4. Run Backend Migrations
      - name: Run Backend Migrations
        run: cd back && yarn migrate:prod
        env:
          GCLOUD_PROJECT: my-pills-staging-460b5
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/back/serviceAccountKey.json

      # 5. Build applications
      - name: Build frontend and back
        run: |
        # Build Front
          cd front
          yarn install --frozen-lockfile  # Double-check deps are here
          yarn generate                  # This runs 'nuxt generate' via yarn context

        # Build Back
          cd ../back
          yarn install --frozen-lockfile
          yarn build
        env:
          NODE_ENV: production
          ENVIRONMENT: staging
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
      # Build Firebase functions
      - name: Build Firebase functions
        run: cd back && yarn build

      - name: Create SA Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}' > $HOME/gcloud.json

      - name: Run Backend Migrations
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud.json
          cd back && yarn migrate:prod
        env:
          GCLOUD_PROJECT: my-pills-staging-460b5

      - name: Cleanup SA Key
        run: rm $HOME/gcloud.json

      - name: '🚀 Deploy to Firebase'
        uses: w9jds/firebase-action@v13.16.0
        with:
          args: deploy --only functions,hosting --project my-pills-staging-460b5 --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}

      # 7. CLEANUP AT THE VERY END 🧹
      - name: Cleanup SA Key
        if: always() # Runs even if tests or deploy fail
        run: rm ${{ github.workspace }}/back/serviceAccountKey.json
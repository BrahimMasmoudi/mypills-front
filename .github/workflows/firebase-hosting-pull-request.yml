name: Deploy to Firebase Hosting on PR
on: pull_request

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  # JOB 1: Install Dependencies
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Node Modules
        id: cache-modules
        uses: actions/cache@v5
        with:
          path: |
            front/node_modules
            back/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('front/yarn.lock', 'back/yarn.lock') }}

      - name: Install All Dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          cd front && yarn install --frozen-lockfile --ignore-scripts
          cd ../back && yarn install --frozen-lockfile

  # JOB 2: Run Backend Tests
  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            front/node_modules
            back/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('front/yarn.lock', 'back/yarn.lock') }}

      - name: Create SA Key for Integration Tests
        run: |
          mkdir -p back
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}' > back/serviceAccountKey.json

      - name: Run Backend Tests
        run: cd back && yarn test
        env:
          TZ: UTC
          GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json

      - name: Cleanup SA Key
        if: always()
        run: rm -f back/serviceAccountKey.json

  # JOB 3: Build & Deploy (Only runs if 'test' passes)
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            front/node_modules
            back/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('front/yarn.lock', 'back/yarn.lock') }}

      - name: Create SA Key for Migrations & Deploy
        run: |
          mkdir -p back
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}' > back/serviceAccountKey.json

      - name: Run Backend Migrations
        run: cd back && yarn migrate:prod
        env:
          GCLOUD_PROJECT: my-pills-staging-460b5
          GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json

      - name: Generate Frontend
        run: |
          cd front
          npx nuxi prepare
          yarn generate
        env:
          NODE_ENV: production
          ENVIRONMENT: staging
          FUNCTIONS_URL: ${{ secrets.FUNCTIONS_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_APP_CHECK_SITE_KEY }}

      - name: Build Backend (Functions)
        run: cd back && yarn build

      - name: '🚀 Deploy to Firebase'
        uses: w9jds/firebase-action@v15.10.1
        with:
          args: deploy --only functions,hosting,firestore,storage --project my-pills-staging-460b5 --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}

      - name: Cleanup SA Key
        if: always()
        run: rm -f back/serviceAccountKey.json

  # JOB 4: E2E Tests on Staging
  e2e-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cypress run
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_BASE_URL: https://my-pills-staging-460b5.web.app/
          CYPRESS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}
        with:
          working-directory: e2e
          browser: firefox
          install-command: yarn install --frozen-lockfile
          summary-title: 'Chrome Staging E2E'

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-results
          path: |
            ${{ github.workspace }}/e2e/cypress/screenshots
            ${{ github.workspace }}/e2e/cypress/videos
          if-no-files-found: warn
name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  # JOB 1: Install Dependencies
  install_dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Front Node Modules
        id: cache-front
        uses: actions/cache@v4
        with:
          path: front/node_modules
          key: ${{ runner.os }}-front-${{ hashFiles('front/yarn.lock') }}

      - name: Install Front Dependencies
        if: steps.cache-front.outputs.cache-hit != 'true'
        run: |
          cd front
          yarn install --frozen-lockfile --ignore-scripts

      - name: Install Back Dependencies
        run: |
          cd back
          yarn install --frozen-lockfile

  # JOB 2: Build, Test and Deploy
  build_and_deploy:
    needs: install_dependencies
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # Retrieve Front Cache
      - name: Restore Front Cache
        uses: actions/cache@v4
        with:
          path: front/node_modules
          key: ${{ runner.os }}-front-${{ hashFiles('front/yarn.lock') }}

      # 1. CREATE THE KEY
      - name: Create SA Key
        run: |
          mkdir -p back
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}' > back/serviceAccountKey.json

      # 2. TEST BACKEND (Requires local install since back isn't usually cached)
      - name: Backend Tests
        run: |
          cd back
          yarn install --frozen-lockfile
          yarn test
        env:
          TZ: UTC
          GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json

      # 3. RUN MIGRATIONS
      - name: Run Backend Migrations
        run: |
          cd back
          yarn migrate:prod
        env:
          GCLOUD_PROJECT: my-pills-staging-460b5
          GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json

      # 4. GENERATE FRONTEND (Using cached node_modules)
      - name: Generate Frontend
        run: |
          cd front
          npx nuxi prepare
          yarn generate
        env:
          NODE_ENV: production
          ENVIRONMENT: staging
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}

      # 5. BUILD BACKEND
      - name: Build Backend
        run: |
          cd back
          yarn build

      # 6. DEPLOY
      - name: '🚀 Deploy to Firebase'
        uses: w9jds/firebase-action@v13.16.0
        with:
          args: deploy --only functions,hosting --project my-pills-staging-460b5 --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}

      # 7. CLEANUP
      - name: Cleanup SA Key
        if: always()
        run: rm -f back/serviceAccountKey.json
name: Verify & E2E on PR
on: pull_request

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  # JOB 1: Install Dependencies
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Node Modules
        id: cache-modules
        uses: actions/cache@v5
        with:
          path: |
            front/node_modules
            back/node_modules
            e2e/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('front/yarn.lock', 'back/yarn.lock', 'e2e/yarn.lock') }}

      - name: Install All Dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          cd front && yarn install --frozen-lockfile --ignore-scripts
          cd ../back && yarn install --frozen-lockfile
          cd ../e2e && yarn install --frozen-lockfile

  # JOB 2: Static Verification, Offline Unit Tests, and E2E Bundle Build
  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            front/node_modules
            back/node_modules
            e2e/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('front/yarn.lock', 'back/yarn.lock', 'e2e/yarn.lock') }}

      - name: Verify Backend (Lint, Typecheck, Build, Offline Tests)
        run: |
          cd back
          yarn lint
          yarn typecheck
          yarn build
          yarn test
        env:
          TZ: UTC

      - name: Prepare Frontend Types
        run: yarn --cwd front nuxi prepare
        env:
          NUXT_TELEMETRY_DISABLED: 1

      - name: Verify & Generate Frontend (Lint, Typecheck, Unit Tests, Emulator Bundle)
        run: |
          cd front
          yarn lint
          yarn typecheck
          yarn test
          yarn generate
        env:
          NUXT_TELEMETRY_DISABLED: 1
          NUXT_PUBLIC_USE_EMULATORS: true
          FIREBASE_API_KEY: AIzaSyD8L9ygNvkH0FO46dceDGmneRwQ7WuaFBk
          FIREBASE_AUTH_DOMAIN: my-pills-staging-460b5.firebaseapp.com
          FIREBASE_PROJECT_ID: my-pills-staging-460b5
          FIREBASE_STORAGE_BUCKET: my-pills-staging-460b5.firebasestorage.app
          FIREBASE_MESSAGING_SENDER_ID: 824429090964
          FIREBASE_APP_ID: 1:824429090964:web:7e0cb8ae45c2424b8afc81

      - name: Typecheck E2E
        run: yarn --cwd e2e typecheck

      - name: Upload Compiled Backend Functions
        uses: actions/upload-artifact@v7
        with:
          name: back-lib
          path: back/lib
          retention-days: 1

      - name: Upload Static Frontend Bundle
        uses: actions/upload-artifact@v7
        with:
          name: front-public
          path: front/.output/public
          retention-days: 1

  # JOB 3: Ephemeral Emulator E2E Tests
  e2e-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore Node Modules Cache
        uses: actions/cache@v5
        with:
          path: |
            front/node_modules
            back/node_modules
            e2e/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('front/yarn.lock', 'back/yarn.lock', 'e2e/yarn.lock') }}

      - name: Cache Cypress Binary
        id: cache-cypress
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('e2e/yarn.lock') }}

      - name: Install Cypress Binary
        if: steps.cache-cypress.outputs.cache-hit != 'true'
        run: yarn --cwd e2e cypress install

      - name: Download Compiled Backend Functions
        uses: actions/download-artifact@v7
        with:
          name: back-lib
          path: back/lib

      - name: Download Static Frontend Bundle
        uses: actions/download-artifact@v7
        with:
          name: front-public
          path: front/.output/public

      - name: Run Emulator E2E Suite
        run: yarn --cwd e2e firebase emulators:exec --only auth,firestore,functions,storage,hosting "yarn cy:run:local"
        env:
          GCLOUD_PROJECT: my-pills-staging-460b5
          GEMINI_API_KEY: test-gemini-key
          FUNCTIONS_DISCOVERY_TIMEOUT: 60

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-results
          path: |
            ${{ github.workspace }}/e2e/cypress/screenshots
            ${{ github.workspace }}/e2e/cypress/videos
          if-no-files-found: warn

name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

       # Root dependencies (optional)
      - name: Install root dependencies
        run: if [ -f package.json ]; then yarn install --frozen-lockfile; fi

      # 1. CREATE THE KEY FIRST (Used by Tests, Migrations, and Build)
      - name: Create SA Key
        run: |
          mkdir -p back
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}' > back/serviceAccountKey.json

      # 2. INSTALL & TEST BACKEND
      - name: Backend Tests
        run: |
          cd back
          yarn install --frozen-lockfile
          yarn test
        env:
          TZ: UTC
          GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json

      # 3. RUN MIGRATIONS
      - name: Run Backend Migrations
        run: |
          cd back
          yarn migrate:prod
        env:
          GCLOUD_PROJECT: my-pills-staging-460b5
          GOOGLE_APPLICATION_CREDENTIALS: ./serviceAccountKey.json

      # 4. BUILD FRONTEND
      - name: Build Frontend
        run: |
          cd front
          # --ignore-scripts stops 'nuxt prepare' from running too early
          yarn install --frozen-lockfile --ignore-scripts 
          
          # Now manually run prepare once everything is installed
          npx nuxi prepare
          
          # Finally, generate
          yarn generate
        env:
          NODE_ENV: production
          ENVIRONMENT: staging
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}

      # 5. BUILD BACKEND (Functions)
      - name: Build Backend
        run: |
          cd back
          yarn build

      # 6. DEPLOY
      - name: '🚀 Deploy to Firebase'
        uses: w9jds/firebase-action@v13.16.0
        with:
          args: deploy --only functions,hosting --project my-pills-staging-460b5 --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_STAGING_460B5 }}

      # 7. CLEANUP
      - name: Cleanup SA Key
        if: always()
        run: rm -f back/serviceAccountKey.json
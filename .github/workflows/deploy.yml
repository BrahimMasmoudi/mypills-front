name: Deploy to Firebase

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      # Install backend dependencies
      - name: Install Backend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: back

      # Install frontend dependencies
      - name: Install Frontend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: front

      # Build frontend
      - name: Build Frontend (Staging)
        run: yarn build
        working-directory: front
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          NODE_ENV: production

      # Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Deploy frontend + functions
      - name: Deploy to Firebase (Staging)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/gcloud-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json
          firebase deploy --only hosting:${{ secrets.FIREBASE_PROJECT_ID }},functions --project ${{ secrets.FIREBASE_PROJECT_ID }}
          rm $HOME/gcloud-key.json

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      # Install backend dependencies
      - name: Install Backend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: back

      # Install frontend dependencies
      - name: Install Frontend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: front

      # Build frontend
      - name: Build Frontend (Production)
        run: yarn build
        working-directory: front
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          NODE_ENV: production

      # Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Deploy frontend + functions
      - name: Deploy to Firebase (Production)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/gcloud-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json
          firebase deploy --only hosting:${{ secrets.FIREBASE_PROJECT_ID }},functions --project ${{ secrets.FIREBASE_PROJECT_ID }}
          rm $HOME/gcloud-key.json

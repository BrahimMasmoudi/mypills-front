name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Install root dependencies (if package.json exists at root)
      - name: Install root dependencies
        run: |
          if [ -f package.json ]; then
            yarn install --frozen-lockfile
          fi

      # Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd front
          yarn install --frozen-lockfile

      # Install Firebase Functions dependencies
      - name: Install Firebase Functions dependencies
        run: |
          cd back
          yarn install --frozen-lockfile

      # Build frontend (Nuxt inside /front)
      - name: Build frontend
        run: |
          cd front
          yarn build

      # Build Firebase Functions
      - name: Build Firebase Functions
        run: |
          cd back
          yarn build

      # Deploy to Firebase (Hosting + Functions if included)
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_PROD }}
          channelId: live
          projectId: mypills-prod

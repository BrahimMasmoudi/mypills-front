name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Root deps (optional)
      - name: Install root dependencies
        run: if [ -f package.json ]; then yarn install --frozen-lockfile; fi

      # Frontend deps
      - name: Install frontend dependencies
        run: cd front && yarn install --frozen-lockfile

      # Firebase Functions deps
      - name: Install Firebase Functions dependencies
        run: cd back && yarn install --frozen-lockfile

      # Build frontend
      - name: Build frontend
        run: cd front && yarn generate
        env:
          NODE_ENV: production
          ENVIRONMENT: production
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

      # Build Firebase Functions
      - name: Build Firebase Functions
        run: cd back && yarn build

      - name: Create SA Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_PROD }}' > $HOME/gcloud.json

      - name: Run Backend Migrations
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud.json
          cd back && yarn migrate:prod
        env:
          GCLOUD_PROJECT: mypills-prod

      - name: Cleanup SA Key
        run: rm $HOME/gcloud.json


      - name: '🚀 Deploy to Firebase'
        uses: w9jds/firebase-action@v13.16.0
        with:
          args: deploy --only functions,hosting --project mypills-prod --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_PROD }}

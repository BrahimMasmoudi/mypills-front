name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Install Dependencies
      - name: Install Dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          cd front && yarn install --frozen-lockfile --ignore-scripts
          cd ../back && yarn install --frozen-lockfile
          cd ../e2e && yarn install --frozen-lockfile

      # Verify Backend
      - name: Verify Backend (Lint, Typecheck, Build, Offline Tests)
        run: |
          cd back
          yarn lint
          yarn typecheck
          yarn build
          yarn test
        env:
          TZ: UTC

      # Verify & Build Frontend
      - name: Prepare, Verify, and Generate Frontend
        run: |
          cd front
          yarn nuxi prepare
          yarn lint
          yarn typecheck
          yarn test
          yarn generate
        env:
          NUXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          ENVIRONMENT: production
          NUXT_PUBLIC_USE_EMULATORS: false
          FUNCTIONS_URL: ${{ secrets.FUNCTIONS_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.FIREBASE_APP_CHECK_SITE_KEY }}

      # Verify E2E Types
      - name: Typecheck E2E
        run: yarn --cwd e2e typecheck

      - name: Set Backend Environment Variables
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > back/.env

      - name: Create SA Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_PROD }}' > $HOME/gcloud.json

      - name: Run Backend Migrations
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud.json
          cd back && yarn migrate:prod
        env:
          GCLOUD_PROJECT: mypills-prod

      - name: Cleanup SA Key
        if: always()
        run: rm -f $HOME/gcloud.json

      - name: '🚀 Deploy to Firebase'
        uses: w9jds/firebase-action@v15.10.1
        with:
          args: deploy --only functions,hosting,firestore,storage --project mypills-prod --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_PROD }}

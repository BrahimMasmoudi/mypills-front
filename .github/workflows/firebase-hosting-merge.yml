name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Root deps (optional)
      - name: Install root dependencies
        run: if [ -f package.json ]; then yarn install --frozen-lockfile; fi

      # Frontend deps
      - name: Install frontend dependencies
        run: cd front && yarn install --frozen-lockfile

      # Firebase Functions deps
      - name: Install Firebase Functions dependencies
        run: cd back && yarn install --frozen-lockfile

      # Build frontend
      - name: Build frontend
        run: cd front && yarn build

      # Build Firebase Functions
      - name: Build Firebase Functions
        run: cd back && yarn build

      # Deploy
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PILLS_PROD }}
          channelId: live
          projectId: mypills-prod

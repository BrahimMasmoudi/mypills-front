<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5CBA7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E67E22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="20%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#85C1E9;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="250" r="80" fill="#EBEDEF" opacity="0.5"/>
  <circle cx="320" cy="50" r="40" fill="#EBEDEF" opacity="0.5"/>

  <g opacity="0.2" fill="#2C3E50">
    <ellipse cx="200" cy="230" rx="110" ry="20" />
    <ellipse cx="180" cy="225" rx="70" ry="15" opacity="0.5"/>
  </g>

  <g transform="translate(180, 180) rotate(110)">
    <rect x="-40" y="-70" width="80" height="120" rx="15" ry="15" fill="url(#bottleGrad)" stroke="#BA4A00" stroke-width="2"/>
    <rect x="-25" y="-95" width="50" height="30" fill="#E67E22" stroke="#BA4A00" stroke-width="2"/>
    <ellipse cx="0" cy="-95" rx="25" ry="8" fill="#D35400"/>
    <ellipse cx="0" cy="-95" rx="18" ry="5" fill="#9C3900"/>
    
    <rect x="-35" y="-50" width="70" height="60" rx="5" fill="#FDFEFE" opacity="0.8"/>
    <line x1="-25" y1="-30" x2="0" y2="-30" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
    <line x1="-25" y1="10" x2="15" y2="10" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(90, 200) rotate(20)">
    <rect x="-30" y="-15" width="60" height="30" rx="5" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2"/>
    <g stroke="#BDC3C7" stroke-width="2">
      <line x1="-20" y1="-15" x2="-20" y2="15"/>
      <line x1="0" y1="-15" x2="0" y2="15"/>
      <line x1="20" y1="-15" x2="20" y2="15"/>
    </g>
  </g>

  <g fill="#D35400" opacity="0.6">
      <circle cx="250" cy="140" r="2"/>
      <circle cx="265" cy="130" r="3"/>
      <circle cx="270" cy="155" r="2"/>
  </g>

  <g transform="translate(270, 120) rotate(-15)">
    <rect x="-10" y="60" width="20" height="80" rx="10" fill="#34495E"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#3498DB" stroke-width="10"/>
    <circle cx="0" cy="0" r="60" fill="url(#lensGrad)"/>
    
    <g stroke="#E74C3C" stroke-width="8" stroke-linecap="round" opacity="0.8">
      <line x1="-30" y1="-30" x2="30" y2="30"/>
      <line x1="30" y1="-30" x2="-30" y2="30"/>
    </g>
    <path d="M-40,-20 Q-10,-50 40,-20" stroke="white" stroke-width="3" opacity="0.3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
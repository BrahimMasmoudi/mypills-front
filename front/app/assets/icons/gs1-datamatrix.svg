<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  fill="none"
>
  <!-- Background -->
  <rect width="64" height="64" rx="4" fill="white"/>

  <!-- Solid L finder pattern -->
  <rect x="8" y="8" width="6" height="48" fill="currentColor"/>
  <rect x="8" y="50" width="48" height="6" fill="currentColor"/>

  <!-- Dotted top border -->
  <rect x="14" y="8" width="6" height="6" fill="currentColor"/>
  <rect x="26" y="8" width="6" height="6" fill="currentColor"/>
  <rect x="38" y="8" width="6" height="6" fill="currentColor"/>
  <rect x="50" y="8" width="6" height="6" fill="currentColor"/>

  <!-- Dotted right border -->
  <rect x="50" y="14" width="6" height="6" fill="currentColor"/>
  <rect x="50" y="26" width="6" height="6" fill="currentColor"/>
  <rect x="50" y="38" width="6" height="6" fill="currentColor"/>

  <!-- Data modules (stylized, dense) -->
  <rect x="18" y="18" width="6" height="6" fill="currentColor"/>
  <rect x="26" y="18" width="6" height="6" fill="currentColor"/>
  <rect x="34" y="18" width="6" height="6" fill="currentColor"/>
  <rect x="42" y="18" width="6" height="6" fill="currentColor"/>

  <rect x="18" y="26" width="6" height="6" fill="currentColor"/>
  <rect x="34" y="26" width="6" height="6" fill="currentColor"/>
  <rect x="42" y="26" width="6" height="6" fill="currentColor"/>

  <rect x="18" y="34" width="6" height="6" fill="currentColor"/>
  <rect x="26" y="34" width="6" height="6" fill="currentColor"/>
  <rect x="34" y="34" width="6" height="6" fill="currentColor"/>
  <rect x="42" y="34" width="6" height="6" fill="currentColor"/>

  <rect x="18" y="42" width="6" height="6" fill="currentColor"/>
  <rect x="26" y="42" width="6" height="6" fill="currentColor"/>
  <rect x="34" y="42" width="6" height="6" fill="currentColor"/>
  <rect x="42" y="42" width="6" height="6" fill="currentColor"/>
</svg>

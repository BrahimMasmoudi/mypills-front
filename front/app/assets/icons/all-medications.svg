<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid of 9 pills representing "all" medications -->
  
  <!-- Top row -->
  <circle cx="6" cy="6" r="2.5" fill="currentColor"/>
  <circle cx="12" cy="6" r="2.5" fill="currentColor"/>
  <circle cx="18" cy="6" r="2.5" fill="currentColor"/>
  
  <!-- Middle row -->
  <circle cx="6" cy="12" r="2.5" fill="currentColor"/>
  <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
  <circle cx="18" cy="12" r="2.5" fill="currentColor"/>
  
  <!-- Bottom row -->
  <circle cx="6" cy="18" r="2.5" fill="currentColor"/>
  <circle cx="12" cy="18" r="2.5" fill="currentColor"/>
  <circle cx="18" cy="18" r="2.5" fill="currentColor"/>
  
  <!-- Small highlights for depth -->
  <circle cx="6.7" cy="5.3" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="12.7" cy="5.3" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="18.7" cy="5.3" r="0.8" fill="white" opacity="0.4"/>
</svg>

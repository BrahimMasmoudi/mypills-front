<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="16" />
    </clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <!-- Blue Background -->
    <rect width="32" height="32" fill="#012169"/>
    
    <!-- White Diagonals -->
    <path d="M0,0 L32,32 M32,0 L0,32" stroke="#FFF" stroke-width="4"/>
    
    <!-- Red Diagonals -->
    <path d="M0,0 L14,14 M32,0 L18,14 M0,32 L14,18 M32,32 L18,18" stroke="#C8102E" stroke-width="2"/>
    
    <!-- White Cross -->
    <path d="M16,0 V32 M0,16 H32" stroke="#FFF" stroke-width="8"/>
    
    <!-- Red Cross -->
    <path d="M16,0 V32 M0,16 H32" stroke="#C8102E" stroke-width="5"/>
  </g>
</svg>
